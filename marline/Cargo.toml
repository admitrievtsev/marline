[package]
name = "marline"
version.workspace = true
edition.workspace = true


[dependencies]
marline_scrub = { path = "../marline_scrub", default-features = false }
marline_metrics = { path = "../marline_metrics", optional = true }

marline_sketcher = { path = "../marline_sketcher" }
chunkfs = { git = "https://github.com/Piletskii-Oleg/chunkfs.git", features = ["chunkers", "hashers"]}
csv = "1.3"

[features]
default = ["runtime-metrics"]
runtime-metrics = ["dep:marline_metrics", "marline_scrub/runtime-metrics"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"


[profile.release]
debug = true
